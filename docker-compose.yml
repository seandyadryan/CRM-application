services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: crm_app
    restart: unless-stopped
    environment:
      APP_NAME: "CRM Application"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: crm_application
      DB_USERNAME: crm_user
      DB_PASSWORD: crm_password
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      RUN_MIGRATIONS: "true"
      RUN_SEEDER: "true"
    volumes:
      - ./backend:/var/www/html
      - crm_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm_network

  nginx:
    image: nginx:1.27-alpine
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - crm_network

  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_application
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    ports:
      - "5433:5432"
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_application"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

volumes:
  crm_postgres_data:
  crm_vendor:

networks:
  crm_network:
    driver: bridge
